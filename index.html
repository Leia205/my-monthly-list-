<!DOCTYPE html>

<html lang="sv">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Monthly List 🌷</title>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      padding: 24px 16px;

      font-family: -apple-system, sans-serif;

      background: #fff4f8;

      color: #59434f;

    }

    .app {

      max-width: 480px;

      margin: auto;

      background: white;

      padding: 24px;

      border-radius: 25px;

      box-shadow: 0 8px 30px #e8cbd8;

    }

    h1 {

      text-align: center;

      color: #d76d9b;

      margin-top: 4px;

    }

    .subtitle {

      text-align: center;

      color: #a17e90;

    }

    .month {

      width: 100%;

      padding: 12px;

      border: 1px solid #efc6d8;

      border-radius: 12px;

      font-size: 16px;

      margin: 12px 0 20px;

      background: #fffafd;

      color: inherit;

    }

    .add {

      display: flex;

      gap: 8px;

    }

    input {

      min-width: 0;

      flex: 1;

      padding: 12px;

      border: 1px solid #efc6d8;

      border-radius: 12px;

      font-size: 16px;

    }

    button {

      border: 0;

      border-radius: 12px;

      padding: 12px 16px;

      background: #e98bb1;

      color: white;

      font-size: 16px;

      cursor: pointer;

    }

    ul {

      padding: 0;

      list-style: none;

    }

    li {

      display: flex;

      align-items: center;

      gap: 10px;

      padding: 13px 10px;

      margin-top: 10px;

      background: #fff4f8;

      border-radius: 12px;

      overflow-wrap: anywhere;

    }

    li span {

      flex: 1;

    }

    li.done span {

      text-decoration: line-through;

      opacity: .55;

    }

    li button {

      padding: 7px 10px;

      background: #d7a4ba;

    }

    .empty {

      text-align: center;

      color: #b39aa7;

      padding: 20px 0;

    }

    footer {

      text-align: center;

      margin-top: 24px;

      color: #b39aa7;

      font-size: 13px;

    }

  </style>

</head>

<body>

  <main class="app">

    <h1>🌷 My Monthly List</h1>

    <p class="subtitle">A little list for a lovely month ♡</p>

    <label for="month">Choose your month</label>

    <select id="month" class="month">

      <option>January</option>

      <option>February</option>

      <option>March</option>

      <option>April</option>

      <option>May</option>

      <option>June</option>

      <option>July</option>

      <option>August</option>

      <option>September</option>

      <option>October</option>

      <option>November</option>

      <option>December</option>

    </select>

    <form id="form" class="add">

      <input id="task" placeholder="Write something to do..." maxlength="120" required>

      <button type="submit">Add +</button>

    </form>

    <ul id="list"></ul>

    <p id="empty" class="empty">Your list is waiting for you ♡</p>

    <footer>Made with love 💗</footer>

  </main>

  <script>

    const month = document.getElementById('month');

    const form = document.getElementById('form');

    const task = document.getElementById('task');

    const list = document.getElementById('list');

    const empty = document.getElementById('empty');

    let tasks = JSON.parse(

      localStorage.getItem('monthly-tasks') || '{}'

    );

    function save() {

      localStorage.setItem(

        'monthly-tasks',

        JSON.stringify(tasks)

      );

    }

    function render() {

      list.innerHTML = '';

      const items = tasks[month.value] || [];

      empty.hidden = items.length > 0;

      items.forEach((item, index) => {

        const li = document.createElement('li');

        if (item.done) {

          li.classList.add('done');

        }

        const check = document.createElement('input');

        check.type = 'checkbox';

        check.checked = item.done;

        check.style.flex = '0 0 20px';

        check.addEventListener('change', () => {

          item.done = check.checked;

          save();

          render();

        });

        const span = document.createElement('span');

        span.textContent = item.text;

        const remove = document.createElement('button');

        remove.textContent = '×';

        remove.setAttribute('aria-label', 'Delete task');

        remove.addEventListener('click', () => {

          tasks[month.value].splice(index, 1);

          save();

          render();

        });

        li.append(check, span, remove);

        list.appendChild(li);

      });

    }

    form.addEventListener('submit', event => {

      event.preventDefault();

      const text = task.value.trim();

      if (!text) return;

      if (!tasks[month.value]) {

        tasks[month.value] = [];

      }

      tasks[month.value].push({

        text: text,

        done: false

      });

      save();

      task.value = '';

      render();

    });

    month.addEventListener('change', render);

    render();

  </script>

</body>

</html>
